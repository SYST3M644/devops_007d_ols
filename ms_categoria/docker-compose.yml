services:
  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=bd_categorias
     

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -u root  -p$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s # ejecuta cada 10 segundos
      retries: 5    # 5 intentos para reintentar 
      timeout: 30s

    volumes:
      - mysql_datos:/var/lib/mysql
  categorias:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms_categorias
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_datos:
