name: Pipeline de ms_categoria

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verifica contenido del repositorio
        run: |
          echo "Este es el contenido del repositorio"
          tree

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Compilando y Ejecutando Test Unitarios
        run: mvn -B package --file ms_categoria/pom.xml

      - name: Resultado
        run: |
          echo "Build y Pruebas Unitarias Exitosas"

      # Despues de ejecutar las pruebas unitarias se crea el reporte
      # HTML de jacoco
      - name: Jacoco Reporte
        uses: actions/upload-artifact@v7
        with:
          name: Jacoco-Reporte
          path: ms_categoria/target/site/jacoco

      - name: Generar reporte HTML de pruebas
        if: always()
        run: mvn -B surefire-report:report-only --file ms_categoria/pom.xml

      - name: Reporte de Pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Reporte-Pruebas
          path: ms_categoria/target/reports

      - name: Analisis SonarQube Cloud
        id: sonar
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true --file ms_categoria/pom.xml

      - name: Alerta si falla SonarQube
        if: failure() && steps.sonar.outcome == 'failure'
        run: |
          echo "### Analisis de SonarQube Cloud fallido" >> $GITHUB_STEP_SUMMARY
          echo "El codigo no paso el Quality Gate. El pipeline queda bloqueado y no se publica la imagen Docker." >> $GITHUB_STEP_SUMMARY
          echo "Detalle: https://sonarcloud.io/dashboard?id=SYST3M644_devops_007d_ols" >> $GITHUB_STEP_SUMMARY
          echo "::error title=SonarQube Cloud::El codigo no paso el Quality Gate"

    #Subimos la imagen docker desde pipeline
      - name: Autenticacion docker
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Subir imagen
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./ms_categoria
          push: true
          tags: ${{ env.IMAGE }}:latest
