name: Pipeline de ms_categoria

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verifica contenido del repositorio
        run: |
          echo "Este es el contenido del repositorio"
          tree

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Compilando y Ejecutando Test Unitarios
        run: mvn -B package --file ms_categoria/pom.xml

      - name: Resultado
        run: |
          echo "Build y Pruebas Unitarias Exitosas"

      # Despues de ejecutar las pruebas unitarias se crea el reporte
      # HTML de jacoco
      - name: Jacoco Reporte
        uses: actions/upload-artifact@v6
        with:
          name: Jacoco-Reporte
          path: ms_categoria/target/site/jacoco

    #Subimos la imagen docker desde pipeline
      - name: Autenticacion docker
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Subir imagen
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./ms_categoria
          push: true
          tags: ${{ env.IMAGE }}:latest
